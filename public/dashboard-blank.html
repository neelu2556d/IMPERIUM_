<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --fg:#fff;
  --mint:#6EE7B7; --mint-cool:#A7F3D0; --mint-ink:#042a1c;
  --muted:rgba(255,255,255,.5); --muted-strong:rgba(255,255,255,.72);
  --border:rgba(255,255,255,.08);
  --serif:'Instrument Serif',Georgia,serif; --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100%;overflow-x:hidden}
::selection{background:rgba(110,231,183,.25);color:#fff}
.atmos{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 42% at 50% 4%,rgba(110,231,183,.14),rgba(110,231,183,.03) 46%,transparent 72%),radial-gradient(ellipse 130% 90% at 50% 116%,rgba(14,38,30,.4),rgba(0,0,0,.94))}
.atmos::before{content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle at 18% 26%,rgba(110,231,183,.5) 0 1px,transparent 1.6px),radial-gradient(circle at 72% 20%,rgba(110,231,183,.4) 0 1px,transparent 1.6px),radial-gradient(circle at 84% 66%,rgba(110,231,183,.35) 0 1px,transparent 1.6px),radial-gradient(circle at 30% 76%,rgba(110,231,183,.3) 0 1px,transparent 1.6px);
  opacity:.6;animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateY(-14px)}}

.wrap{position:relative;z-index:5;max-width:1040px;margin:0 auto;padding:clamp(38px,7vw,72px) clamp(20px,5vw,40px) 90px}

/* header */
.eyebrow{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.26em;color:var(--mint);opacity:0;animation:fade .8s var(--ease) .1s forwards}
.hello{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(2.4rem,7vw,3.8rem);line-height:1.02;letter-spacing:-.01em;margin-top:14px;opacity:0;transform:translateY(10px);animation:rise .9s var(--ease) .18s forwards}
.hello b{font-style:normal;color:var(--mint-cool);font-weight:400}
.clockrow{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-top:16px;opacity:0;animation:fade .9s var(--ease) .3s forwards}
.clock{font-family:var(--mono);font-weight:500;font-size:1.5rem;color:var(--fg);letter-spacing:.02em}
.date{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.18em;color:var(--muted)}

/* the board */
.board{margin-top:clamp(34px,6vw,54px);display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.slot{border:1.5px dashed rgba(255,255,255,.12);border-radius:20px;min-height:150px;display:flex;align-items:center;justify-content:center;
  opacity:0;transform:translateY(14px);animation:rise .7s var(--ease) forwards;animation-delay:calc(var(--i,0)*90ms + .42s)}
.slot .ghost{font-family:var(--mono);font-size:.56rem;text-transform:uppercase;letter-spacing:.18em;color:rgba(255,255,255,.22)}

/* the star: add your first tile */
.add{grid-column:1 / -1;position:relative;border:1.5px dashed rgba(110,231,183,.42);border-radius:24px;background:radial-gradient(ellipse 70% 100% at 50% 0%,rgba(110,231,183,.07),transparent 70%);
  min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:34px 24px;cursor:pointer;overflow:hidden;
  opacity:0;transform:translateY(16px);animation:rise .8s var(--ease) .4s forwards;transition:border-color .3s var(--ease),transform .3s var(--ease)}
.add:hover{border-color:rgba(110,231,183,.7);transform:translateY(-3px)}
.add .plus{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mint-ink);background:linear-gradient(180deg,#8ff0cb,var(--mint));box-shadow:0 0 40px rgba(110,231,183,.35);animation:breathe 4.5s ease-in-out infinite}
.add .plus svg{width:26px;height:26px}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.add h2{font-family:var(--serif);font-style:italic;font-weight:400;font-size:1.7rem}
.add p{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}

.foot{margin-top:34px;text-align:center;font-family:var(--serif);font-style:italic;font-size:1.15rem;color:var(--muted-strong);opacity:0;animation:fade 1s var(--ease) .7s forwards}
.foot b{color:var(--mint-cool);font-style:normal;font-weight:400}

@keyframes fade{to{opacity:1}}
@keyframes rise{to{opacity:1;transform:none}}
@media(max-width:560px){.add{min-height:200px}}
</style>

<div class="atmos"></div>

<main class="wrap">
  <p class="eyebrow"><span id="eb">Your dashboard</span></p>
  <h1 class="hello" id="hello">Good evening, <b>Alex</b></h1>
  <div class="clockrow"><span class="clock" id="clock">--:--</span><span class="date" id="date"></span></div>

  <div class="board">
    <div class="add" id="add">
      <span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
      <h2>Add your first tile</h2>
      <p>Describe it to Claude · it lands right here</p>
    </div>
    <div class="slot" style="--i:0"><span class="ghost">your tiles</span></div>
    <div class="slot" style="--i:1"><span class="ghost">grow here</span></div>
    <div class="slot" style="--i:2"><span class="ghost">one at a time</span></div>
    <div class="slot" style="--i:3"><span class="ghost">all yours</span></div>
  </div>

  <p class="foot">A blank board is not empty. It is <b>everything you haven't built yet.</b></p>
</main>

<script>
  function greet(){
    var h=new Date().getHours();
    return h<12?'Good morning':h<18?'Good afternoon':'Good evening';
  }
  document.getElementById('hello').innerHTML = greet() + ', <b>Alex</b>';
  function tick(){
    var d=new Date();
    var hh=d.getHours(), mm=String(d.getMinutes()).padStart(2,'0');
    var ap=hh<12?'AM':'PM'; var h12=(hh%12)||12;
    document.getElementById('clock').textContent = h12+':'+mm+' '+ap;
    document.getElementById('date').textContent = d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  }
  tick(); setInterval(tick,1000);
</script>
