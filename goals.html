<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Goalmaxxing</title>
  <style>
    :root {
      --bg: #0A0A0B; --bg-deep: #050506;
      --bg-secondary: rgba(255,255,255,0.035); --bg-card: rgba(255,255,255,0.04);
      --glass-bg: rgba(255,255,255,0.04); --glass-bg-hover: rgba(255,255,255,0.07); --glass-bg-strong: rgba(255,255,255,0.085);
      --glass-border: transparent; --glass-border-strong: transparent;
      --glass-shadow: 0 1px 0 0 rgba(255,255,255,0.06) inset, 0 12px 40px rgba(0,0,0,0.45), 0 1px 2px rgba(0,0,0,0.25);
      --text-primary: #FAFAFA; --text-secondary: #B8B6B0; --text-tertiary: #76746E; --text-quaternary: #4D4B47;
      --border: transparent; --border-soft: transparent; --border-strong: transparent;
      --accent: #E07658; --accent-hi: #F08A6C; --accent-glow: rgba(224,118,88,0.40);
      --success: #6BE3A4; --warning: #F2C063; --danger: #FF6B6B;
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 22px;
      --font: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      color-scheme: dark;
    }
    html, body { margin: 0; padding: 24px 16px; background: var(--bg-deep); color: var(--text-primary); font-family: var(--font); -webkit-font-smoothing: antialiased; min-height: 100vh; }
    .section { max-width: 680px; margin: 0 auto 24px; }
    .section-title { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 34px; letter-spacing: -0.02em; margin-bottom: 14px; font-weight: 400; }
    .card { background: var(--glass-bg); border: 1px solid rgba(255,255,255,0.04); border-radius: var(--radius-xl); padding: 22px; margin-bottom: 12px; box-shadow: var(--glass-shadow); }
    .empty-state { font-size: 12px; color: var(--text-tertiary); text-align: center; padding: 14px 0; font-style: italic; }
/* GOAL LOGGER — primary input + tiered button system */
.goal-input-wrap { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.goal-input-wrap .goal-input { min-width: 200px; }
.goal-input {
  flex: 1;
  padding: 11px 14px;
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  font-size: 13px;
  font-family: inherit;
  background: rgba(255, 255, 255, 0.035);
  color: var(--text-primary);
  backdrop-filter: blur(8px);
  transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
}
.goal-input::placeholder { color: var(--text-tertiary); }
.goal-input:focus {
  outline: none;
  border-color: rgba(255, 255, 255, 0.45);
  background: rgba(255, 255, 255, 0.06);
  box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.08);
}

/* PRIMARY button — used sparingly for headline actions only */
.goal-add-btn {
  padding: 11px 20px;
  background: linear-gradient(180deg, #FFFFFF 0%, #E8E5DD 100%);
  color: #0A0A0B;
  border: 1px solid rgba(255, 255, 255, 0.85);
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: 0.005em;
  box-shadow:
    0 1px 0 rgba(255, 255, 255, 0.5) inset,
    0 6px 18px rgba(0, 0, 0, 0.45),
    0 1px 2px rgba(0, 0, 0, 0.3);
  transition: transform 0.12s, box-shadow 0.18s, opacity 0.15s, background 0.18s;
}
.goal-add-btn:hover {
  background: linear-gradient(180deg, #FFFFFF 0%, #F2F0EA 100%);
  transform: translateY(-1px);
  box-shadow:
    0 1px 0 rgba(255, 255, 255, 0.6) inset,
    0 8px 24px rgba(0, 0, 0, 0.55),
    0 1px 2px rgba(0, 0, 0, 0.3);
}
.goal-add-btn:active { transform: translateY(0) scale(0.98); }
.goal-add-btn:disabled { opacity: 0.45; cursor: wait; transform: none; }

/* SECONDARY button — glass outline */
.goal-add-btn-secondary {
  background: rgba(255, 255, 255, 0.04);
  color: var(--text-primary);
  border: 1px solid var(--glass-border);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
}
.goal-add-btn-secondary:hover {
  background: rgba(255, 255, 255, 0.085);
  border-color: var(--border-strong);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
  transform: translateY(-1px);
}

.goal-list { list-style: none; }
.goal-list-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  margin-bottom: 6px;
  font-size: 13.5px;
  transition: background 0.18s, border-color 0.18s, transform 0.12s, opacity 0.3s;
  position: relative;
}
.goal-list-item:hover {
  background: rgba(255, 255, 255, 0.065);
  border-color: var(--border-strong);
}
.goal-list-item:hover .gm-drag-handle { opacity: 1; }
.goal-list-item:hover .goal-delete { opacity: 1; }
.goal-list-item.done {
  opacity: 0.45;
  background: rgba(107, 227, 164, 0.04);
  border-color: rgba(107, 227, 164, 0.20);
}
.goal-list-item.done .goal-list-text { text-decoration: line-through; text-decoration-color: rgba(255,255,255,0.4); }

/* Productivity-window queue: tap the ⚡ button to flag a goal for the peak focus window.
   Yellow tint + a left accent stripe + a satisfying flash pulse when toggled. */
.goal-list-item.queued {
  background: rgba(242, 192, 99, 0.10);
  box-shadow: inset 3px 0 0 0 #F2C063;
  transition: background 0.3s ease, box-shadow 0.3s ease;
}
.goal-list-item.queued .goal-list-text {
  color: #FFE2A8;
}
.goal-list-item.is-queue-flashing {
  animation: gm-queue-flash 0.48s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes gm-queue-flash {
  0%   { background: rgba(255, 255, 255, 0.025); transform: scale(1); }
  35%  { background: rgba(242, 192, 99, 0.32); transform: scale(1.015); box-shadow: 0 0 18px rgba(242, 192, 99, 0.55); }
  100% { background: rgba(242, 192, 99, 0.10); transform: scale(1); box-shadow: inset 3px 0 0 0 #F2C063; }
}
/* The ⚡ button itself */
.gm-queue-btn {
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 4px 8px;
  font-size: 14px;
  line-height: 1;
  color: var(--text-tertiary);
  border-radius: 7px;
  opacity: 0.55;
  transition: color 0.15s, background 0.15s, opacity 0.15s, transform 0.12s, filter 0.18s;
  font-family: inherit;
}
.gm-queue-btn:hover {
  background: rgba(242, 192, 99, 0.10);
  color: #F2C063;
  opacity: 1;
}
.gm-queue-btn:active { transform: scale(0.85); }
.gm-queue-btn.is-on {
  color: #F2C063;
  opacity: 1;
  filter: drop-shadow(0 0 4px rgba(242, 192, 99, 0.65));
}
.gm-queue-btn:disabled { cursor: not-allowed; opacity: 0.3; }

.goal-list-item.gm-dragging {
  opacity: 0.4;
  background: rgba(255, 255, 255, 0.10);
  border-color: rgba(255, 255, 255, 0.30);
}
.goal-list-item.gm-drag-over { border-top: 2px solid #FFFFFF; }

/* Drag handle — appears on hover */
.gm-drag-handle {
  flex-shrink: 0;
  width: 14px;
  cursor: grab;
  opacity: 0;
  transition: opacity 0.15s;
  color: var(--text-tertiary);
  font-size: 14px;
  line-height: 1;
  user-select: none;
  letter-spacing: -2px;
  text-align: center;
}
.gm-drag-handle:active { cursor: grabbing; }
@media (hover: none) { .gm-drag-handle { opacity: 0.5; } }

/* Custom checkbox — bigger, smoother, more satisfying */
.goal-checkbox {
  width: 22px; height: 22px;
  flex-shrink: 0;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  border: 1.5px solid var(--border-strong);
  border-radius: 7px;
  background: rgba(0, 0, 0, 0.30);
  position: relative;
  transition: background 0.2s, border-color 0.2s, transform 0.12s;
}
.goal-checkbox:hover {
  border-color: rgba(255, 255, 255, 0.50);
  background: rgba(255, 255, 255, 0.06);
}
.goal-checkbox:checked {
  background: #6BE3A4;
  border-color: #6BE3A4;
  box-shadow: 0 0 12px rgba(107, 227, 164, 0.40);
}
.goal-checkbox:checked::after {
  content: '';
  position: absolute;
  left: 6px; top: 2px;
  width: 6px; height: 11px;
  border: solid #0A0A0B;
  border-width: 0 2.2px 2.2px 0;
  transform: rotate(45deg);
  animation: gm-check-pop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes gm-check-pop {
  from { transform: rotate(45deg) scale(0); }
  to   { transform: rotate(45deg) scale(1); }
}
.goal-checkbox:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* Inline-editable goal text */
.goal-list-text {
  cursor: text;
  padding: 2px 4px;
  border-radius: 4px;
  margin: -2px -4px;
  transition: background 0.15s;
}
.goal-list-text:hover { background: rgba(255, 255, 255, 0.04); }
.goal-list-text.gm-editing {
  background: rgba(0, 0, 0, 0.30);
  outline: 1.5px solid rgba(255, 255, 255, 0.45);
  cursor: text;
}
.goal-delete { opacity: 0.5; transition: color 0.15s, opacity 0.15s; }

/* ============================================================
   GOALMAXXING — hero progress + streak + all-done state
   ============================================================ */
.gm-card { padding: 22px 22px 18px !important; }
.gm-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.gm-head-left { flex: 1; min-width: 0; }
.gm-eyebrow {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  margin-bottom: 6px;
}
.gm-progress-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.gm-progress-num {
  font-size: 42px;
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 1;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
  transition: color 0.4s;
}
.gm-progress-total {
  font-size: 18px;
  color: var(--text-tertiary);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  font-family: var(--font-mono);
}
.gm-progress-label {
  font-size: 11px;
  color: var(--text-tertiary);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.10em;
  margin-left: 4px;
}

/* Streak pill */
.gm-streak {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border-soft);
  font-size: 11px;
  color: var(--text-tertiary);
  font-weight: 600;
  letter-spacing: 0.04em;
  flex-shrink: 0;
  transition: all 0.3s;
}
.gm-streak.gm-streak-active {
  background: rgba(242, 192, 99, 0.10);
  border-color: rgba(242, 192, 99, 0.32);
  color: #F2C063;
}
.gm-streak-icon {
  font-size: 13px;
  line-height: 1;
  transition: filter 0.3s;
}
.gm-streak.gm-streak-active .gm-streak-icon {
  filter: drop-shadow(0 0 6px rgba(242, 192, 99, 0.6));
}
.gm-streak-num {
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--text-primary);
}
.gm-streak.gm-streak-active .gm-streak-num { color: #F2C063; }
.gm-streak-label {
  text-transform: uppercase;
  letter-spacing: 0.10em;
}

/* Segmented progress bar — one segment per goal */
.gm-bar {
  display: flex;
  gap: 4px;
  height: 6px;
  margin-bottom: 16px;
}
.gm-bar:empty { display: none; }
.gm-bar-seg {
  flex: 1;
  height: 100%;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 999px;
  border: 1px solid var(--border-soft);
  transition: background 0.4s, border-color 0.4s, box-shadow 0.4s;
}
.gm-bar-seg.gm-bar-seg-done {
  background: #6BE3A4;
  border-color: #6BE3A4;
  box-shadow: 0 0 6px rgba(107, 227, 164, 0.40);
}

/* All-done celebration state on the card */
.gm-card.gm-all-done {
  border-color: rgba(107, 227, 164, 0.30) !important;
  background:
    radial-gradient(60% 50% at 50% 0%, rgba(107, 227, 164, 0.06), transparent 70%),
    rgba(255, 255, 255, 0.04) !important;
}
.gm-card.gm-all-done .gm-progress-num { color: #6BE3A4; }
.gm-card.gm-all-done .gm-progress-label { color: #6BE3A4; opacity: 0.9; }

/* Quick-add row: tighter spacing, feels like one element */
.gm-input-wrap { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-soft); }

/* Push-to-tomorrow quick action */
.gm-push-btn {
  display: block;
  width: 100%;
  padding: 9px 12px;
  margin-top: 4px;
  background: rgba(255, 255, 255, 0.025);
  border: 1px dashed var(--glass-border);
  color: var(--text-tertiary);
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.18s, border-color 0.18s, color 0.18s;
}
.gm-push-btn:hover {
  background: rgba(255, 255, 255, 0.06);
  border-color: var(--border-strong);
  color: var(--text-primary);
  border-style: solid;
}

/* Tomorrow card variants */
/* Show-N-more toggle when goal list exceeds 5 items */
.gm-list-toggle-wrap {
  list-style: none;
  margin-top: 4px;
}
.gm-list-toggle {
  width: 100%;
  padding: 9px 12px;
  background: rgba(255, 255, 255, 0.025);
  border: 1px dashed var(--glass-border);
  color: var(--text-tertiary);
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.18s, border-color 0.18s, color 0.18s;
  text-align: center;
}
.gm-list-toggle:hover {
  background: rgba(255, 255, 255, 0.06);
  border-color: var(--border-strong);
  color: var(--text-primary);
}
.gm-list-toggle-arrow { font-size: 13px; margin-left: 4px; }

.gm-card-tomorrow .gm-progress-row { display: none; }
.gm-tomorrow-sub {
  font-size: 12px;
  color: var(--text-tertiary);
  margin-top: 2px;
  letter-spacing: 0.005em;
}
.gm-tomorrow-count {
  font-size: 11px;
  color: var(--text-tertiary);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  font-family: var(--font-mono);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  white-space: nowrap;
}
.goal-list-text { flex: 1; color: var(--text-primary); word-break: break-word; }
.goal-delete {
  background: none;
  border: none;
  color: var(--text-tertiary);
  cursor: pointer;
  font-size: 16px;
  padding: 0 4px;
  line-height: 1;
  transition: color 0.15s;
}
.goal-delete:hover { color: var(--danger); }
.date-tag { font-size: 11px; color: var(--text-tertiary); margin-bottom: 8px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.empty-state {
  font-size: 12px;
  color: var(--text-tertiary);
  text-align: center;
  padding: 14px 0;
  font-style: italic;
}

.history-card {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  padding: 11px 13px;
  margin-bottom: 6px;
  font-size: 12px;
}
.history-date { font-weight: 700; color: var(--text-secondary); margin-bottom: 4px; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; }
.history-line { color: var(--text-primary); padding: 2px 0; }
.history-line.done::before { content: "✓ "; color: var(--success); font-weight: 700; }
.history-line.undone::before { content: "○ "; color: var(--text-tertiary); }

/* QUICK ADD */
.quick-add {
  display: flex;
  </style>
</head>
<body>

<div class="section gm-section">
  <div class="section-title">Goalmaxxing</div>

  <!-- TODAY card -->
  <div class="card gm-card" id="gmTodayCard">
    <!-- Hero header: progress + streak -->
    <div class="gm-head">
      <div class="gm-head-left">
        <div class="gm-eyebrow" id="todayLabel">Today</div>
        <div class="gm-progress-row">
          <span id="gmProgressNum" class="gm-progress-num">0</span>
          <span id="gmProgressTotal" class="gm-progress-total">/ 0</span>
          <span id="gmProgressLabel" class="gm-progress-label">complete</span>
        </div>
      </div>
      <div class="gm-streak" id="gmStreak" title="Consecutive days you completed every goal">
        <span class="gm-streak-icon">⚡</span>
        <span class="gm-streak-num" id="gmStreakNum">0</span>
        <span class="gm-streak-label">day streak</span>
      </div>
    </div>

    <!-- Segmented progress bar (one segment per goal) -->
    <div class="gm-bar" id="gmBar"></div>

    <!-- Goal list -->
    <ul class="goal-list gm-list" id="goalList"></ul>
    <div class="empty-state" id="emptyState">No goals for today yet. Add one below.</div>

    <!-- Push-remaining quick action (only when there are unchecked goals + after 6 PM) -->
    <button id="gmPushBtn" class="gm-push-btn" type="button" style="display:none">
      → Push remaining to tomorrow
    </button>

    <!-- Quick-add row -->
    <div class="goal-input-wrap gm-input-wrap">
      <input type="text" class="goal-input" id="goalInput" placeholder="Add a goal for today…" />
      <button class="goal-add-btn" id="goalAddBtn" title="Add as-is (Enter)">+ Add</button>
      <button class="goal-add-btn goal-add-btn-secondary" id="goalPolishBtn" title="AI cleans up wording">✨ Polish</button>
    </div>
    <div class="polish-status" id="polishStatus"></div>
  </div>

  <!-- PLAN TOMORROW card -->
  <div class="card gm-card gm-card-tomorrow">
    <div class="gm-head">
      <div class="gm-head-left">
        <div class="gm-eyebrow" id="tomorrowLabel">Plan tomorrow</div>
        <div class="gm-tomorrow-sub">Write tonight, locked until 6 AM.</div>
      </div>
      <div class="gm-tomorrow-count" id="gmTomorrowCount">0 planned</div>
    </div>
    <ul class="goal-list gm-list" id="tomorrowList"></ul>
    <div class="empty-state" id="tomorrowEmpty">Nothing planned for tomorrow yet</div>
    <div class="goal-input-wrap gm-input-wrap">
      <input type="text" class="goal-input" id="tomorrowInput" placeholder="Add a goal for tomorrow…" />
      <button class="goal-add-btn" id="tomorrowAddBtn" title="Add as-is (Enter)">+ Add</button>
      <button class="goal-add-btn goal-add-btn-secondary" id="tomorrowPolishBtn">✨ Polish</button>
    </div>
    <div class="polish-status" id="tomorrowStatus"></div>
  </div>
</div>

<script>
(function(){
  'use strict';
  function dk(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  const todayKey = 'goals:'+dk();
  const tom = new Date(); tom.setDate(tom.getDate()+1);
  const tomorrowKey = 'goals:'+dk(tom);

  const get = k => { try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch{return null;} };
  const set = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} };

  function calcStreak(){
    let s = 0;
    const today = get(todayKey)||[];
    if (today.length>0 && today.every(g=>g.done)) s = 1;
    const d = new Date(); d.setDate(d.getDate()-1);
    for (let i=0;i<365;i++){
      const g = get('goals:'+dk(d));
      if (!g || g.length===0 || !g.every(x=>x.done)) break;
      s++; d.setDate(d.getDate()-1);
    }
    return s;
  }

  function buildRow(g, i, key){
    const li = document.createElement('li');
    li.className = 'goal-list-item'+(g.done?' goal-done':'');

    const ck = document.createElement('button');
    ck.type='button'; ck.className='goal-check'+(g.done?' is-on':''); ck.textContent = g.done?'✓':'';
    ck.onclick = () => { const arr=get(key)||[]; if(arr[i]) arr[i].done=!arr[i].done; set(key,arr); renderAll(); };
    li.appendChild(ck);

    const tx = document.createElement('span');
    tx.className='goal-list-text'; tx.textContent = g.text;
    tx.onclick = () => {
      const inp = document.createElement('input');
      inp.type='text'; inp.value=g.text; inp.className='goal-edit-input';
      tx.replaceWith(inp); inp.focus(); inp.select();
      const commit = () => { const t=inp.value.trim(); if(t){ const arr=get(key)||[]; if(arr[i]) arr[i].text=t; set(key,arr); } renderAll(); };
      inp.onblur = commit;
      inp.onkeydown = e => { if(e.key==='Enter') inp.blur(); else if(e.key==='Escape') renderAll(); };
    };
    li.appendChild(tx);

    const del = document.createElement('button');
    del.type='button'; del.className='goal-delete'; del.textContent='×';
    del.onclick = e => { e.stopPropagation(); const arr=get(key)||[]; arr.splice(i,1); set(key,arr); renderAll(); };
    li.appendChild(del);
    return li;
  }

  function renderToday(){
    const arr = get(todayKey)||[];
    const list = document.getElementById('goalList');
    const empty = document.getElementById('emptyState');
    const numEl = document.getElementById('gmProgressNum');
    const totEl = document.getElementById('gmProgressTotal');
    const lblEl = document.getElementById('gmProgressLabel');
    const bar = document.getElementById('gmBar');
    const card = document.getElementById('gmTodayCard');
    const pushBtn = document.getElementById('gmPushBtn');

    const done = arr.filter(g=>g.done).length;
    numEl.textContent = done;
    totEl.textContent = '/ '+arr.length;
    lblEl.textContent = arr.length===0?'no goals yet':(done===arr.length?'all done. solid day':'complete');

    bar.innerHTML = '';
    arr.forEach(g => { const s=document.createElement('div'); s.className='gm-bar-seg'+(g.done?' gm-bar-seg-done':''); bar.appendChild(s); });
    card.classList.toggle('gm-all-done', arr.length>0 && done===arr.length);

    list.innerHTML='';
    arr.forEach((g,i)=>list.appendChild(buildRow(g,i,todayKey)));
    empty.style.display = arr.length?'none':'';
    pushBtn.style.display = arr.some(g=>!g.done)?'':'none';

    const stk = document.getElementById('gmStreakNum');
    const sw  = document.getElementById('gmStreak');
    const s = calcStreak();
    stk.textContent = s;
    sw.classList.toggle('gm-streak-active', s>0);
  }

  function renderTomorrow(){
    const arr = get(tomorrowKey)||[];
    const list = document.getElementById('tomorrowList');
    const empty = document.getElementById('tomorrowEmpty');
    const cnt = document.getElementById('gmTomorrowCount');
    cnt.textContent = arr.length+' planned';
    list.innerHTML='';
    arr.forEach((g,i)=>list.appendChild(buildRow(g,i,tomorrowKey)));
    empty.style.display = arr.length?'none':'';
  }

  function renderAll(){ renderToday(); renderTomorrow(); }

  function addGoal(input, key){
    const t = input.value.trim();
    if (!t) return;
    const arr = get(key)||[];
    arr.push({ text:t, done:false, createdAt:Date.now() });
    set(key, arr);
    input.value='';
    renderAll();
  }

  document.getElementById('goalAddBtn').onclick = () => addGoal(document.getElementById('goalInput'), todayKey);
  document.getElementById('goalInput').onkeydown = e => { if(e.key==='Enter') addGoal(e.target, todayKey); };
  document.getElementById('tomorrowAddBtn').onclick = () => addGoal(document.getElementById('tomorrowInput'), tomorrowKey);
  document.getElementById('tomorrowInput').onkeydown = e => { if(e.key==='Enter') addGoal(e.target, tomorrowKey); };

  document.getElementById('goalPolishBtn').onclick = () => {
    const s = document.getElementById('polishStatus');
    s.textContent = 'AI Polish not wired in standalone. Add an API key to enable.';
    setTimeout(()=>s.textContent='', 4000);
  };
  document.getElementById('tomorrowPolishBtn').onclick = () => {
    const s = document.getElementById('tomorrowStatus');
    s.textContent = 'AI Polish not wired in standalone. Add an API key to enable.';
    setTimeout(()=>s.textContent='', 4000);
  };

  document.getElementById('gmPushBtn').onclick = () => {
    const td = get(todayKey)||[];
    const remaining = td.filter(g=>!g.done);
    if (!remaining.length) return;
    const tm = get(tomorrowKey)||[];
    remaining.forEach(g => tm.push({ text:g.text, done:false, createdAt:Date.now() }));
    set(tomorrowKey, tm);
    set(todayKey, td.filter(g=>g.done));
    renderAll();
  };

  // Minimal styles for the list rows (since the original CSS focused on the card chrome)
  const s = document.createElement('style');
  s.textContent = ''+
    '.goal-list{list-style:none;padding:0;margin:14px 0 0 0;}'+
    '.goal-list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04);}'+
    '.goal-list-item:last-child{border-bottom:none;}'+
    '.goal-list-item.goal-done .goal-list-text{color:var(--text-tertiary);text-decoration:line-through;}'+
    '.goal-check{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.2);background:transparent;color:var(--success);font-size:14px;line-height:1;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0;transition:all 0.2s;font-family:inherit;}'+
    '.goal-check.is-on{background:var(--success);border-color:var(--success);color:#050506;}'+
    '.goal-check:hover:not(.is-on){border-color:var(--accent);}'+
    '.goal-list-text{flex:1;cursor:text;}'+
    '.goal-input{flex:1;padding:10px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:10px;color:var(--text-primary);font:inherit;outline:none;min-width:0;}'+
    '.goal-input:focus{border-color:var(--accent);}'+
    '.goal-input-wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.04);}'+
    '.goal-add-btn{padding:10px 14px;background:rgba(224,118,88,0.15);border:1px solid rgba(224,118,88,0.32);border-radius:10px;color:var(--accent-hi);cursor:pointer;font:inherit;font-weight:600;font-size:13px;transition:background 0.2s;}'+
    '.goal-add-btn:hover{background:rgba(224,118,88,0.28);}'+
    '.goal-add-btn-secondary{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.1);color:var(--text-secondary);}'+
    '.goal-edit-input{flex:1;background:rgba(255,255,255,0.04);border:1px solid var(--accent);border-radius:6px;padding:4px 8px;color:var(--text-primary);font:inherit;}'+
    '.polish-status{font-size:11px;color:var(--text-tertiary);margin-top:6px;min-height:14px;}';
  document.head.appendChild(s);

  renderAll();
})();
</script>
</body>
</html>
