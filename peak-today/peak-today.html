<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your peak today</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500;1,6..72,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ============================================================
 * Your peak today — standalone artifact (Vitality).
 * Sections: 01 Right now · 02 Your day (energy curve) ·
 * 03 Peak windows · 04 Log. Real circadian + WHOOP curve math
 * ported from app/app/peak/curve.ts. Vanilla CSS+JS,
 * own localStorage. Demo signal is fully interactive — the
 * hosted Vitality module fills it from your real wearable.
 * ============================================================ */
:root{
  --bg:#000000;
  --fg:#F2F5F3;
  --muted:rgba(242,245,243,.52);
  --muted-strong:rgba(242,245,243,.74);
  --faint:rgba(242,245,243,.34);
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.12);
  --card:rgba(255,255,255,.018);
  --card-2:rgba(255,255,255,.03);
  --mint:#6EE7B7;
  --mint-bright:#9CF5D2;
  --mint-glow:rgba(110,231,183,.45);
  --amber:#F59E0B;
  --red:#EF4444;
  --serif:"Newsreader",Georgia,serif;
  --sans:"Inter",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{
  max-width:1000px;margin:0 auto;padding:40px 24px 100px;min-height:100vh;
  background:
    radial-gradient(900px 520px at 50% 38%, rgba(40,90,70,.16), transparent 60%),
    var(--bg);
}
::selection{background:rgba(110,231,183,.25)}
.grain::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.03;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");background-size:200px 200px}

/* header */
.head{margin-bottom:34px}
.htitle{font-family:var(--serif);font-style:italic;font-size:38px;font-weight:500;line-height:1;letter-spacing:-.01em}
.htitle em{color:var(--mint);font-style:italic}
.hsub{font-family:var(--mono);font-size:12px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;margin-top:12px}

/* live ticker */
.ticker{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:46px;background:var(--card)}
.ticker-track{display:flex;white-space:nowrap;animation:scroll 30s linear infinite;width:max-content}
.ticker:hover .ticker-track{animation-play-state:paused}
.tk{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:17px 0;color:var(--muted)}
.tk b{color:var(--fg);font-weight:600;letter-spacing:.04em}
.tk .dot{width:6px;height:6px;border-radius:50%}
.tk.live b{color:var(--mint)}
.tk .sep{color:var(--faint);margin:0 26px;opacity:.6}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.live-pip{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 9px var(--mint-glow);animation:pulse 1.7s ease-in-out infinite}

/* section eyebrow */
.sec{margin-bottom:46px}
.sec-head{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.sec-num{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--faint)}
.sec-label{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.sec-rule{flex:1;height:1px;background:var(--line)}
.sec-info{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-2);color:var(--muted);font-size:11px;font-style:italic;font-family:var(--serif);display:flex;align-items:center;justify-content:center}

.panel{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:26px}

/* 01 right now */
.now-grid{display:grid;grid-template-columns:.85fr 1.4fr;gap:18px}
.ring-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.ring-wrap{position:relative;width:188px;height:188px}
.ring-wrap svg{transform:rotate(-90deg);overflow:visible}
.ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;font-size:62px;font-weight:500;color:var(--mint)}
.ring-tier{font-family:var(--serif);font-style:italic;font-size:21px;margin-top:2px}
.ring-cap{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.why-link{margin-top:14px;background:none;border:0;color:var(--mint);font-family:var(--serif);font-style:italic;font-size:15px;cursor:pointer}
.why-link:hover{color:var(--mint-bright)}

.today-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mint);margin-bottom:14px}
.today-hero{font-family:var(--serif);font-style:italic;font-size:27px;font-weight:500;line-height:1.18;margin-bottom:18px}
.today-body{font-size:15px;color:var(--muted-strong);line-height:1.5;margin-bottom:22px}
.bullets{display:flex;flex-direction:column;gap:16px}
.bullet{display:flex;gap:12px;font-size:14.5px;line-height:1.5;color:var(--muted-strong)}
.bullet .b-dot{width:7px;height:7px;border-radius:50%;background:var(--mint);margin-top:7px;flex:0 0 auto;box-shadow:0 0 8px var(--mint-glow)}
.bullet b{color:var(--fg);font-weight:600}

/* 02 curve */
.curve-head{display:flex;align-items:flex-start;gap:24px;margin-bottom:14px;flex-wrap:wrap}
.mini-ring{position:relative;width:84px;height:84px;flex:0 0 auto}
.mini-ring svg{transform:rotate(-90deg);overflow:visible}
.mini-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;font-size:30px;font-weight:500}
.mini-meta .m-label{font-family:var(--serif);font-style:italic;font-size:18px}
.mini-meta .m-now{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.mini-meta .m-hint{font-size:12px;color:var(--faint);margin-top:8px;display:flex;align-items:center;gap:7px}
.mini-meta .m-hint::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--faint)}
.curve-copy{flex:1;min-width:200px}
.curve-copy .ce{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.curve-copy p{font-size:14px;color:var(--muted-strong);line-height:1.5;max-width:330px}
.toggle{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:4px;gap:2px;background:rgba(255,255,255,.02)}
.toggle button{border:0;background:transparent;color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:8px 18px;border-radius:999px;cursor:pointer;transition:.18s}
.toggle button.active{background:rgba(110,231,183,.14);color:var(--mint-bright)}
.chart{width:100%;height:auto;display:block;cursor:crosshair}
.chart text{font-family:var(--mono)}
.plan{margin-top:18px;border-top:1px solid var(--line);padding-top:18px}
.plan .pe{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:13px}
.plan-empty{border:1px dashed var(--line-2);border-radius:12px;padding:18px;text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);cursor:pointer;transition:.2s}
.plan-empty:hover{border-color:rgba(110,231,183,.3);color:var(--muted)}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--card-2)}
.chip .bar{width:4px;background:var(--mint)}
.chip .body{padding:9px 14px}
.chip .t{font-size:13px;font-weight:600}
.chip .s{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px}

/* 03 peak windows */
.bh-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}
.bh-list{display:flex;flex-direction:column;gap:12px}
.bh{display:flex;align-items:center;gap:18px;border:1px solid var(--line);border-radius:14px;padding:20px 22px;background:var(--card-2)}
.bh.active{border-color:rgba(110,231,183,.4);background:rgba(110,231,183,.05)}
.bh.past{opacity:.5}
.bh-time{flex:1}
.bh-range{font-family:var(--serif);font-style:italic;font-size:27px;line-height:1}
.bh-when{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.bh-meta{text-align:right;display:flex;flex-direction:column;gap:3px}
.bh-tier{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.bh-peak{font-family:var(--serif);font-style:italic;font-size:22px}
.bh-block{background:rgba(110,231,183,.08);border:1px solid rgba(110,231,183,.28);border-radius:999px;color:var(--mint);font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:9px 16px;cursor:pointer;transition:.2s}
.bh-block:hover{background:rgba(110,231,183,.16)}

/* 04 log */
.log-row{display:flex;align-items:center;gap:16px;border:1px solid var(--line);border-radius:14px;padding:18px 20px;background:var(--card);margin-bottom:12px;cursor:pointer;transition:.2s;width:100%;text-align:left;color:inherit;font:inherit}
.log-row:hover{border-color:var(--line-2);background:var(--card-2)}
.log-ico{width:42px;height:42px;border-radius:11px;background:rgba(110,231,183,.1);display:flex;align-items:center;justify-content:center;color:var(--mint);flex:0 0 auto}
.log-ico svg{width:20px;height:20px}
.log-txt{flex:1}
.log-title{font-size:15px;font-weight:600}
.log-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.log-arrow{color:var(--muted);font-size:18px}

.mood-card{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:24px;margin-top:8px}
.mood-card h2{font-family:var(--serif);font-style:italic;font-size:20px;font-weight:500;margin-bottom:18px}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.mood-btn{border:1px solid var(--line);border-radius:13px;background:var(--card-2);padding:18px 8px 14px;cursor:pointer;text-align:center;transition:.18s}
.mood-btn:hover{transform:translateY(-2px);border-color:var(--line-2)}
.mood-btn .dot{width:14px;height:14px;border-radius:50%;margin:0 auto 13px;border:2px solid var(--c)}
.mood-btn[data-fill="1"] .dot{background:var(--c)}
.mood-btn span{font-size:13px}
.mood-btn.active{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.mood-btn.active span{font-weight:600}

/* modal */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:400px;max-width:100%;border:1px solid var(--line-2);border-radius:var(--radius);background:#0a0d0b;padding:24px}
.modal h3{font-family:var(--serif);font-style:italic;font-size:22px;margin-bottom:4px}
.modal .msub{font-size:13px;color:var(--muted);margin-bottom:20px}
.driver{margin-bottom:16px}
.driver .dtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px}
.driver .dval{font-family:var(--mono);font-size:13px}
.driver .dtrack{height:6px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden;position:relative}
.driver .dfill{position:absolute;top:0;left:0;height:100%;border-radius:999px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.driver .ddetail{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}
.modal-close{margin-top:16px;width:100%;border:1px solid var(--line-2);background:transparent;color:var(--fg);border-radius:11px;padding:12px;cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.modal-close:hover{border-color:var(--mint)}

.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#0c1410;border:1px solid rgba(110,231,183,.3);border-radius:999px;padding:12px 20px;display:flex;align-items:center;gap:10px;font-size:13px;z-index:60;animation:rise .25s ease}
.toast .tdot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint-glow)}
@keyframes rise{from{opacity:0;transform:transl(-50%,8px)}to{opacity:1}}

@media(max-width:720px){
  .now-grid{grid-template-columns:1fr}
  .curve-head{flex-direction:column;gap:16px}
  .htitle{font-size:30px}
  .moods{gap:7px}.mood-btn span{font-size:11px}
}
</style>
</head>
<body class="grain">

  <!-- HEADER (gem logo intentionally omitted) -->
  <header class="head">
    <div class="htitle">Your <em>peak</em> today</div>
    <div class="hsub" id="dateLabel">—</div>
  </header>

  <!-- LIVE TICKER -->
  <div class="ticker"><div class="ticker-track" id="ticker"></div></div>

  <!-- 01 RIGHT NOW -->
  <section class="sec">
    <div class="sec-head">
      <span class="sec-num">·01</span>
      <span class="sec-label">Right now</span>
      <span class="sec-rule"></span>
      <span class="sec-info">i</span>
    </div>
    <div class="panel">
      <div class="now-grid">
        <div class="ring-card">
          <div class="ring-wrap">
            <svg width="188" height="188" viewBox="0 0 188 188">
              <circle cx="94" cy="94" r="80" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="8"/>
              <circle id="dayRing" cx="94" cy="94" r="80" fill="none" stroke="var(--mint)" stroke-width="8"
                      stroke-linecap="round" stroke-dasharray="502.6" stroke-dashoffset="502.6"
                      style="filter:drop-shadow(0 0 10px var(--mint-glow));transition:stroke-dashoffset .6s cubic-bezier(.2,.7,.2,1)"/>
            </svg>
            <div class="ring-num" id="dayScore">—</div>
          </div>
          <div class="ring-tier" id="dayTier">—</div>
          <div class="ring-cap">Today overall</div>
          <button class="why-link" id="whyLink">Why this score →</button>
        </div>
        <div>
          <div class="today-eyebrow">Today</div>
          <div class="today-hero" id="todayHero">—</div>
          <div class="bullets" id="bullets"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 02 YOUR DAY -->
  <section class="sec">
    <div class="sec-head">
      <span class="sec-num">·02</span>
      <span class="sec-label">Your day</span>
      <span class="sec-rule"></span>
    </div>
    <div class="panel">
      <div class="curve-head">
        <div class="mini-ring">
          <svg width="84" height="84" viewBox="0 0 84 84">
            <circle cx="42" cy="42" r="35" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="5"/>
            <circle id="miniRing" cx="42" cy="42" r="35" fill="none" stroke="var(--mint)" stroke-width="5"
                    stroke-linecap="round" stroke-dasharray="219.9" stroke-dashoffset="219.9"
                    style="filter:drop-shadow(0 0 7px var(--mint-glow));transition:stroke-dashoffset .35s"/>
          </svg>
          <div class="mini-num" id="miniNum">—</div>
        </div>
        <div class="mini-meta">
          <div class="m-label">Peak</div>
          <div class="m-now" id="miniWhen">Right now</div>
          <div class="m-hint">Hover the curve</div>
        </div>
        <div class="curve-copy">
          <div class="ce">Today’s energy curve</div>
          <p>Your predicted score, hour by hour. Hover the curve to scrub.</p>
        </div>
        <div class="toggle" id="toggle">
          <button data-mode="line" class="active">Line</button>
          <button data-mode="bars">Bars</button>
          <button data-mode="stack">Stack</button>
        </div>
      </div>

      <svg class="chart" id="chart" viewBox="0 0 1000 380" preserveAspectRatio="none"></svg>

      <div class="plan">
        <div class="pe">Today’s plan</div>
        <div id="planArea"></div>
      </div>
    </div>
  </section>

  <!-- 03 PEAK WINDOWS -->
  <section class="sec">
    <div class="sec-head">
      <span class="sec-num">·03</span>
      <span class="sec-label">Peak windows</span>
      <span class="sec-rule"></span>
    </div>
    <div class="panel">
      <div class="bh-head">
        <span class="sec-label" id="bhCount">Best hours</span>
        <span class="sec-label">Today</span>
      </div>
      <div class="bh-list" id="bhList"></div>
    </div>
  </section>

  <!-- 04 LOG -->
  <section class="sec">
    <div class="sec-head">
      <span class="sec-num">·04</span>
      <span class="sec-label">Log</span>
      <span class="sec-rule"></span>
    </div>

    <button class="log-row" id="logWater">
      <span class="log-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.5c4 5 6.5 8 6.5 11.5a6.5 6.5 0 0 1-13 0C5.5 10.5 8 7.5 12 2.5z"/></svg></span>
      <span class="log-txt">
        <span class="log-title">Log water</span>
        <span class="log-sub" id="waterSub">Track hydration in one place</span>
      </span>
      <span class="log-arrow">→</span>
    </button>

    <button class="log-row" id="connectWearable">
      <span class="log-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l2 6 4-14 2 8h6"/></svg></span>
      <span class="log-txt">
        <span class="log-title">Connect a wearable</span>
        <span class="log-sub">WHOOP · Fitbit · Oura — sleep &amp; recovery</span>
      </span>
      <span class="log-arrow">→</span>
    </button>

    <div class="mood-card">
      <h2>How are you feeling?</h2>
      <div class="moods" id="moods"></div>
    </div>
  </section>

<script>
/* ============================================================
   YOUR PEAK TODAY — standalone. Real curve math from
   app/app/peak/curve.ts. Own localStorage. No backend.
   ============================================================ */
const KEY = "vitality.peaktoday.v1";

/* Circadian baseline (25 points, hours 0..24) — identical to curve.ts BASELINE */
const BASELINE = [18,12,10,14,16,22,30,42,55,68,75,70,62,50,44,48,56,64,72,84,92,88,64,38,18];

const MOODS = [
  {id:"foggy",  label:"Foggy",  c:"#EF4444", fill:0},
  {id:"tired",  label:"Tired",  c:"#F59E0B", fill:0},
  {id:"steady", label:"Steady", c:"#8a908d", fill:0},
  {id:"sharp",  label:"Sharp",  c:"#6EE7B7", fill:0},
  {id:"peak",   label:"Peak",   c:"#6EE7B7", fill:1},
];

/* Demo WHOOP signal — reproduces the reference screenshots exactly.
   The hosted module replaces this with your real wearable feed. */
function seed(){
  return {
    mood:null, mode:"line",
    whoop:{ recovery:92, sleepHours:7.6, sleepDebtHours:0.3, hrv:38, hrvAnomalous:true },
    hydration:0,            // glasses logged today (0..8)
  };
}
let S = load();
function load(){ try{const r=JSON.parse(localStorage.getItem(KEY)); return r&&r.whoop?r:seed();}catch(e){return seed();} }
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }

const now = new Date();
const nowHour = now.getHours() + now.getMinutes()/60;

/* ---------------- CURVE MATH (port) ---------------- */
function whoopMultiplier(w){
  const m = new Array(25).fill(1); let touched=false;
  const wake = 7;
  if(typeof w.recovery==="number"){ const r=Math.max(0,Math.min(100,w.recovery)); const rm=0.55+(r/100)*0.65; for(let h=0;h<25;h++)m[h]*=rm; touched=true; }
  if(typeof w.sleepScore==="number" && w.sleepScore<70){ const cap=0.65+(Math.max(0,w.sleepScore)/70)*0.35; for(let h=0;h<25;h++)m[h]=Math.min(m[h],cap); touched=true; }
  if(typeof w.sleepDebtHours==="number" && w.sleepDebtHours>0.5){ const debt=Math.min(1,w.sleepDebtHours/4); for(let i=0;i<6;i++){const h=(wake+i)%24; m[h]*= 1-(0.12*debt*(1-i/6));} touched=true; }
  // HRV: noisy/anomalous readings are skipped entirely (can't poison the score)
  if(typeof w.hrv==="number" && !w.hrvAnomalous && w.hrv>=15 && w.hrv<=150 && w.hrv<80){
    const hm=0.85+(Math.max(0,w.hrv)/80)*0.15; for(let h=0;h<25;h++)m[h]*=hm; touched=true;
  }
  return touched?m:null;
}
function computeCurve(){
  const wm = whoopMultiplier(S.whoop);
  return BASELINE.map((v,i)=> wm ? Math.max(0,Math.min(100, v*wm[i])) : v );
}
function scoreAtHour(curve,h){
  if(h<=0)return curve[0]; if(h>=24)return curve[24];
  const i=Math.floor(h), f=h-i; return curve[i]*(1-f)+curve[i+1]*f;
}
function tierFor(s){ if(s>=80)return"Peak"; if(s>=65)return"Solid"; if(s>=50)return"Tired"; if(s>=35)return"Low"; return"Drained"; }
function tierHint(t){return {Peak:"Push hard. Use this window for your hardest task.",Solid:"Train normal. Knock out the meaningful work.",Tired:"Moderate. Light cognitive load, easy admin tasks.",Low:"Recover. Walk, hydrate, no important decisions.",Drained:"Rest. Anything you push now is borrowed against tomorrow."}[t];}
const TIER_COLOR={Peak:"#6EE7B7",Solid:"#6EE7B7",Tired:"#F59E0B",Low:"#d97706",Drained:"#EF4444"};

function bestWindows(curve,threshold=75){
  const runs=[]; let start=null;
  for(let i=0;i<curve.length;i++){
    if(curve[i]>=threshold){ if(start==null)start=i; }
    else if(start!=null){ if(i-start>=1)runs.push({start,end:i}); start=null; }
  }
  if(start!=null && curve.length-1-start>=1) runs.push({start,end:curve.length-1});
  return runs.map(r=>{
    let peakHour=r.start,peakScore=0,sum=0,n=0;
    for(let h=r.start;h<=r.end;h++){ sum+=curve[h];n++; if(curve[h]>peakScore){peakScore=curve[h];peakHour=h;} }
    return {...r,peakHour,peakScore,avg:sum/n,tier:tierFor(peakScore)};
  }).sort((a,b)=>b.peakScore-a.peakScore);
}

/* whole-day driver score (sums to the ring number) */
function scoreDrivers(){
  const w=S.whoop; const drivers=[];
  drivers.push({key:"circadian",label:"Circadian rhythm",value:50,color:"var(--mint)",detail:"Your built-in 24-hour energy shape. Peaks late morning and early evening."});
  if(w.recovery!=null){ const v=Math.round((w.recovery-50)*0.5);
    drivers.push({key:"recovery",label:"Recovery",value:v,color:v>=0?"var(--mint)":"var(--red)",detail:`WHOOP recovery ${Math.round(w.recovery)}%. ${v>=0?"Your body is primed to push.":"Your body is asking for a lighter day."}`}); }
  if(w.sleepDebtHours!=null && w.sleepDebtHours>0.5){ const v=-Math.round(w.sleepDebtHours*5);
    drivers.push({key:"sleepDebt",label:"Sleep debt",value:v,color:"var(--red)",detail:`${w.sleepDebtHours.toFixed(1)}h of debt is dragging your ceiling down.`}); }
  else if(w.sleepHours!=null){ drivers.push({key:"sleep",label:"Sleep",value:4,color:"var(--mint)",detail:`${w.sleepHours.toFixed(1)}h slept — well rested, little debt carried in.`}); }
  const hydroVal=Math.min(8,S.hydration*2);
  drivers.push({key:"hydration",label:"Hydration",value:hydroVal,color:hydroVal>0?"var(--mint)":"var(--muted)",detail:hydroVal>0?`${S.hydration} logged today. Cheap, reliable points.`:"No water logged yet — the cheapest boost in your stack."});
  const total=Math.max(0,Math.min(100,drivers.reduce((a,d)=>a+d.value,0)));
  return {drivers,total};
}

/* market ticker signals */
function marketSignals(){
  const w=S.whoop; const out=[];
  if(w.recovery!=null)out.push({label:"Recovery",value:w.recovery+"%",tone:w.recovery>=60?"good":w.recovery>=40?"warn":"bad"});
  if(w.sleepDebtHours!=null)out.push({label:"Sleep debt",value:w.sleepDebtHours.toFixed(1)+"h",tone:w.sleepDebtHours>0.5?"bad":"good"});
  if(w.hrv!=null)out.push({label:"HRV",value:w.hrvAnomalous?"noisy":Math.round(w.hrv)+"ms",tone:w.hrvAnomalous?"warn":"idle"});
  out.push({label:"Hydration",value:S.hydration+"/8",tone:S.hydration>=4?"good":"warn"});
  return out;
}

/* today recommendation (bullets) */
function buildToday(curve){
  const dayScore=scoreDrivers().total; const tier=tierFor(dayScore);
  const w=S.whoop; const hour=nowHour;
  let bestH=0,bestV=-1; for(let h=0;h<25;h++){ if(curve[h]>bestV){bestV=curve[h];bestH=h;} }
  const bullets=[];
  if(w.recovery!=null && w.recovery>=80) bullets.push({t:`Recovery ${Math.round(w.recovery)}%.`,b:"Stack your hardest training or thinking session inside the peak window."});
  else if(w.recovery!=null && w.recovery<50) bullets.push({t:`Recovery ${Math.round(w.recovery)}%.`,b:"Cut caffeine ~30% and skip a second hard session. Brute-forcing a red day costs you tomorrow."});
  if(hour<11) bullets.push({t:"No caffeine logged.",b:"A standard coffee in the next 30 minutes lifts your morning curve ~12 points."});
  if(hour>9 && hour<18 && dayScore>=60) bullets.push({t:"Workout window open.",b:"A session here pegs your peak ~90 min after via BDNF + dopamine."});
  if(S.hydration===0 && hour>8) bullets.push({t:"No hydration logged.",b:"A glass of water + electrolytes nudges focus ~6 points — cheapest move in the stack."});
  const hero=tierHint(tier).replace(/[.!]$/,"")+".";
  return {hero,bullets:bullets.slice(0,3)};
}

function fmt(h){ h=Math.round(h); if(h===0||h===24)return"12 AM"; if(h===12)return"12 PM"; return h<12?h+" AM":(h-12)+" PM"; }
function fmtShort(h){ h=Math.round(h); if(h===0||h===24)return"12a"; if(h===12)return"12p"; return h<12?h+"a":(h-12)+"p"; }

/* ---------------- CHART ---------------- */
const W=1000,H=380,PADX=16,TOP=18,BOT=46,PLOT=H-TOP-BOT;
const X=h=>PADX+(h/24)*(W-2*PADX);
const Y=v=>TOP+(1-v/100)*PLOT;
let hoverHour=null, curve=computeCurve();

function buildChart(){
  const m=S.mode; let s="";
  [25,50,75].forEach(v=>{ s+=`<line x1="${PADX}" y1="${Y(v)}" x2="${W-PADX}" y2="${Y(v)}" stroke="rgba(255,255,255,.05)" stroke-dasharray="2 7"/>`; });
  // shade best windows
  bestWindows(curve).forEach(w=>{ const x1=X(w.start),x2=X(w.end); s+=`<rect x="${x1}" y="${TOP}" width="${x2-x1}" height="${PLOT}" fill="#6EE7B7" fill-opacity="0.05"/>`; });

  const pts=[]; for(let h=0;h<=24;h+=0.1) pts.push([X(h),Y(scoreAtHour(curve,h))]);

  if(m==="bars"){
    for(let h=0;h<24;h++){ const bx=X(h+0.12),bw=X(h+0.88)-bx,by=Y(scoreAtHour(curve,h+0.5)); s+=`<rect x="${bx}" y="${by}" width="${bw}" height="${TOP+PLOT-by}" rx="3" fill="#6EE7B7" fill-opacity="0.28"/>`; }
  } else if(m==="stack"){
    const base=pts.map(([x],i)=>[x,Y(scoreAtHour(curve,i*0.1)*0.55)]);
    s+=`<path d="${area(pts)}" fill="#6EE7B7" fill-opacity="0.10"/>`;
    s+=`<path d="${area(base)}" fill="#9CF5D2" fill-opacity="0.14"/>`;
    s+=`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="#6EE7B7" stroke-width="2.5"/>`;
    s+=`<polyline points="${base.map(p=>p.join(",")).join(" ")}" fill="none" stroke="#9CF5D2" stroke-opacity="0.6" stroke-width="1.5"/>`;
  } else {
    s+=`<defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6EE7B7" stop-opacity="0.3"/><stop offset="1" stop-color="#6EE7B7" stop-opacity="0"/></linearGradient></defs>`;
    s+=`<path d="${area(pts)}" fill="url(#area)"/>`;
    s+=`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="#6EE7B7" stroke-width="3" style="filter:drop-shadow(0 0 6px rgba(110,231,183,.5))"/>`;
  }
  s+=marker(nowHour,"#6EE7B7",false);
  if(hoverHour!==null) s+=marker(hoverHour,"#9CF5D2",true);
  [[0,"12A"],[3,"3A"],[6,"6A"],[9,"9A"],[12,"12P"],[15,"3P"],[18,"6P"],[21,"9P"],[24,"12A"]].forEach(([h,l])=>{
    s+=`<text x="${X(h)}" y="${H-22}" fill="rgba(242,245,243,.4)" font-size="13" text-anchor="${h===0?"start":h===24?"end":"middle"}">${l}</text>`; });
  s+=`<line x1="${PADX}" y1="${TOP+PLOT}" x2="${W-PADX}" y2="${TOP+PLOT}" stroke="rgba(255,255,255,.1)"/>`;
  document.getElementById("chart").innerHTML=s;
}
function area(pts){ return `M ${pts[0][0]} ${TOP+PLOT} L `+pts.map(p=>p.join(" ")).join(" L ")+` L ${pts[pts.length-1][0]} ${TOP+PLOT} Z`; }
function marker(h,col,dashed){
  const x=X(h),y=Y(scoreAtHour(curve,h));
  let s=`<line x1="${x}" y1="${TOP}" x2="${x}" y2="${TOP+PLOT}" stroke="${col}" stroke-opacity="${dashed?.5:.28}" stroke-dasharray="3 5"/>`;
  s+=`<circle cx="${x}" cy="${y}" r="6" fill="${col}" style="filter:drop-shadow(0 0 7px ${col})"/>`;
  s+=`<circle cx="${x}" cy="${y}" r="10" fill="none" stroke="${col}" stroke-opacity=".4"/>`;
  return s;
}
const chartEl=document.getElementById("chart");
chartEl.addEventListener("mousemove",e=>{ const r=chartEl.getBoundingClientRect(); hoverHour=Math.max(0,Math.min(24,((e.clientX-r.left)/r.width)*24)); buildChart(); updateMini(); });
chartEl.addEventListener("mouseleave",()=>{ hoverHour=null; buildChart(); updateMini(); });

/* ---------------- MINI RING (02) ---------------- */
function updateMini(){
  const h=hoverHour!==null?hoverHour:nowHour;
  const v=Math.round(scoreAtHour(curve,h));
  const C=2*Math.PI*35;
  document.getElementById("miniRing").style.strokeDashoffset=C*(1-v/100);
  document.getElementById("miniNum").textContent=v;
  document.getElementById("miniNum").style.color=TIER_COLOR[tierFor(v)];
  document.getElementById("miniWhen").textContent=hoverHour!==null?fmt(h):"Right now";
}

/* ---------------- 01 RIGHT NOW ---------------- */
function renderRightNow(){
  const {total}=scoreDrivers(); const tier=tierFor(total);
  const C=2*Math.PI*80;
  document.getElementById("dayRing").style.strokeDashoffset=C*(1-total/100);
  document.getElementById("dayScore").textContent=total;
  document.getElementById("dayTier").textContent=tier;
  const t=buildToday(curve);
  document.getElementById("todayHero").textContent=t.hero;
  document.getElementById("bullets").innerHTML=t.bullets.map(b=>`<div class="bullet"><span class="b-dot"></span><div><b>${b.t}</b> ${b.b}</div></div>`).join("");
}

/* ---------------- 03 PEAK WINDOWS ---------------- */
function renderWindows(){
  const wins=bestWindows(curve);
  document.getElementById("bhCount").textContent=`Best hours · ${wins.length} window${wins.length!==1?"s":""}`;
  document.getElementById("bhList").innerHTML = wins.length? wins.map(w=>{
    const past=w.end<nowHour, active=nowHour>=w.start&&nowHour<=w.end, col=TIER_COLOR[w.tier];
    return `<div class="bh ${active?"active":""} ${past?"past":""}">
      <div class="bh-time">
        <div class="bh-range" style="color:${past?'var(--muted)':col}">${fmtShort(w.start)}–${fmtShort(w.end)}</div>
        <div class="bh-when">${active?"In it now":past?"Passed":"Peaks "+fmt(w.peakHour)}</div>
      </div>
      <div class="bh-meta">
        <div class="bh-tier" style="color:${past?'var(--muted)':col}">${w.tier}</div>
        <div class="bh-peak" style="color:${past?'var(--muted)':'var(--fg)'}">${Math.round(w.peakScore)}</div>
      </div>
      ${past?"":`<button class="bh-block" data-h="${w.peakHour}">Block →</button>`}
    </div>`;
  }).join("") : `<div class="bh-when" style="padding:8px 0">No peak windows today — recovery is capping your ceiling. Rest, hydrate, aim for tomorrow.</div>`;
  document.querySelectorAll(".bh-block").forEach(b=>b.onclick=()=>toast(`Blocked ${fmt(+b.dataset.h)} for deep work`));
}

/* ---------------- TICKER ---------------- */
function renderTicker(){
  const sig=marketSignals();
  const one=`<span class="tk live"><span class="live-pip"></span><b>Live</b><span class="sep">/</span></span>`+
    sig.map(s=>`<span class="tk">${s.label} <b>${s.value}</b><span class="sep">/</span></span>`).join("");
  document.getElementById("ticker").innerHTML=one+one;
}

/* ---------------- 02 PLAN ---------------- */
function renderPlan(){
  document.getElementById("planArea").innerHTML=`<div class="plan-empty" id="planTap">Nothing scheduled · tap to plan your day</div>`;
  document.getElementById("planTap").onclick=()=>toast("Scheduling lives in the full Vitality app");
}

/* ---------------- 04 MOOD ---------------- */
function renderMoods(){
  document.getElementById("moods").innerHTML=MOODS.map(m=>`<button class="mood-btn ${S.mood===m.id?"active":""}" data-id="${m.id}" data-fill="${m.fill}" style="--c:${m.c}"><div class="dot"></div><span>${m.label}</span></button>`).join("");
  document.querySelectorAll(".mood-btn").forEach(b=>b.onclick=()=>{ S.mood=b.dataset.id; save(); renderMoods(); });
}

/* ---------------- MODAL (why this score) ---------------- */
function openWhy(){
  const {drivers,total}=scoreDrivers();
  const max=Math.max(...drivers.map(d=>Math.abs(d.value)),1);
  const body=drivers.map(d=>`<div class="driver">
      <div class="dtop"><span>${d.label}</span><span class="dval" style="color:${d.value<0?'var(--red)':'var(--mint)'}">${d.value>=0?"+":""}${d.value}</span></div>
      <div class="dtrack"><div class="dfill" style="width:${Math.abs(d.value)/max*100}%;background:${d.color}"></div></div>
      <div class="ddetail">${d.detail}</div>
    </div>`).join("");
  const el=document.createElement("div"); el.className="backdrop";
  el.innerHTML=`<div class="modal"><h3>Why your score is ${total}</h3><div class="msub">Every point, accounted for.</div>${body}<button class="modal-close">Close</button></div>`;
  el.onclick=e=>{ if(e.target===el||e.target.classList.contains("modal-close"))el.remove(); };
  document.body.appendChild(el);
}

/* ---------------- TOAST ---------------- */
let toastTimer=null;
function toast(text){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const el=document.createElement("div"); el.className="toast";
  el.innerHTML=`<span class="tdot"></span>${text}`; document.body.appendChild(el);
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.remove(),2400);
}

/* ---------------- WIRE ---------------- */
document.getElementById("whyLink").onclick=openWhy;
document.getElementById("logWater").onclick=()=>{
  if(S.hydration<8){ S.hydration++; save(); refreshAll(); toast(`Water logged · ${S.hydration}/8 · +2 to your score`); }
  else toast("You're fully hydrated today 💧");
};
document.getElementById("connectWearable").onclick=()=>toast("Wearable OAuth lives in the full Vitality app");
document.getElementById("toggle").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return; S.mode=b.dataset.mode; save(); document.querySelectorAll("#toggle button").forEach(x=>x.classList.toggle("active",x===b)); buildChart(); });

function refreshWaterSub(){ document.getElementById("waterSub").textContent = S.hydration>0?`${S.hydration}/8 glasses logged today`:"Track hydration in one place"; }
function refreshAll(){ curve=computeCurve(); buildChart(); updateMini(); renderRightNow(); renderWindows(); renderTicker(); refreshWaterSub(); }

function init(){
  document.getElementById("dateLabel").textContent = now.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"}).toUpperCase();
  document.querySelectorAll("#toggle button").forEach(x=>x.classList.toggle("active",x.dataset.mode===S.mode));
  renderPlan(); renderMoods(); refreshAll();
}
init();
</script>
